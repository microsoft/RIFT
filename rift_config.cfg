[Default]
# Windows defaults: place the IDA FLIRT utilities in bin/.
# macOS: use the tools bundled with the installed IDA version, for example:
# /Applications/IDA Professional 9.3.app/Contents/MacOS/tools/flair/pcf
# /Applications/IDA Professional 9.3.app/Contents/MacOS/tools/flair/sigmake
PcfPath = bin/pcf.exe
SigmakePath = bin/sigmake.exe
# Path to work folder, where generated files will be temporarily stored in
WorkFolder = work
# Path to folder, where cargo projects will be initialized
CargoProjFolder = tmp
# Path to generated rustc_hashes.json
RustcHashes = data/rustc_hashes.json
# Windows: use strings.exe from the Sysinternals Suite by Mark Russinovich.
# macOS: use the built-in /usr/bin/strings utility.
StringsTool = bin/strings.exe

[RiftServer]
# local or remote
server_mode = local
Ip = 127.0.0.1
Port = 5001
flirt_dir = ServerStorage
ApiKey =
TlsCert =
TlsKey =
TlsCaCert =
