[Default]
# Windows defaults: place the IDA FLIRT utilities in bin/.
# macOS users should override these with the paths under the IDA app bundle.
PcfPath = bin/pcf.exe
SigmakePath = bin/sigmake.exe
# Path to work folder, where generated files will be temporarily stored in
WorkFolder = work
# Path to folder, where cargo projects will be initialized
CargoProjFolder = tmp
# Path to generated rustc_hashes.json
RustcHashes = data/rustc_hashes.json
# Windows: use strings.exe from the Sysinternals Suite by Mark Russinovich.
# macOS users should override this with /usr/bin/strings.
StringsTool = bin/strings.exe

[RiftServer]
Ip = 127.0.0.1
Port = 5001
